<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" href="images/person.png" type="image/png" />
    <title>Business Card</title>
</head>

<body>

  <div class="business-card">
    <img class="profile-image" src="images/person.png" alt="placeholder-person" />
    <p class="category">Name:</p><p class="full-name">Omar Cloud</p>
    <p class="category">Designation:</p><p class="designation">Web Dev in the making</p>
    <p class="category">Company:</p><p class="company">@auto-formation</p>
    <hr>
    <p class="category">Email:</p><p class="email">example@gmail.com</p>
    <p class="category">Phone:</p><p class="phone">(XXX) 555-555</p>
    <a class="portfolio-link" href="#" target="_blank">Portfolio</a>
    <hr>
    <div class="social-media">
      <h2>Connect with me</h2>
      <a href="#" target="_blank"'>Twitter </a><span>|</span>
      <a href="#" target="_blank">LinkedIn </a><span>|</span>
      <a href="#" target="_blank">GitHub</a>
    </div>
  </div>

</body>

</html>
