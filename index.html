<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Business Card</title>
</head>

<body>

  <div class="business-card">
    <img class="profile-image" src="https://cdn.freecodecamp.org/curriculum/labs/flower.jpg" alt="beautiful pink flower with red circular top" />
    <p class="category">Name:</p><p class="full-name">Omar Cloud</p>
    <p class="category">Designation:</p><p class="designation">Web Dev in the making</p>
    <p class="category">Company:</p><p class="company">@auto-formation</p>
    <hr>
    <p class="category">Email:</p><p class="email">example@gmail.com</p>
    <p class="category">Phone:</p><p class="phone">(XXX) 555-555</p>
    <a class="portfolio-link" href="#">Portfolio</a>
    <hr>
    <div class="social-media">
      <h2>Connect with me</h2>
      <a href="#">Twitter |</a>
      <a href="#">LinkedIn |</a>
      <a href="#">GitHub</a>
    </div>
  </div>

</body>

</html>
